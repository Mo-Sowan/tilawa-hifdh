services:
  api:
    build:
      context: ./backend/Tilawa.Api
    ports:
      - "5188:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Required in production. Generate one with:
      #   openssl rand -base64 48
      Jwt__SigningKey: ${TILAWA_JWT_SIGNING_KEY:?set TILAWA_JWT_SIGNING_KEY}
      Jwt__Issuer: tilawa-api
      Jwt__Audience: tilawa-app
      # OAuth client ids the API will accept tokens for.
      Auth__Google__ClientIds__0: ${TILAWA_GOOGLE_CLIENT_ID:-}
      Auth__Apple__ClientIds__0: ${TILAWA_APPLE_CLIENT_ID:-}
    volumes:
      # SQLite database and the Mushaf page cache.
      - tilawa-data:/app/App_Data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  tilawa-data:
